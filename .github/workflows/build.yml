name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run engine tests
        run: build\EngineTests_artefacts\Release\EngineTests.exe

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "build\ModularSynth_artefacts\Release\Standalone\Modular-synth.exe" dist\
          Copy-Item README.md dist\
          Compress-Archive -Path dist\* -DestinationPath Modular-synth-windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: Modular-synth-windows
          path: dist/

      # Every push to main also publishes a downloadable release on the repo's
      # Releases page, so the newest .exe is always one click away.
      - name: Publish release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Modular-synth build ${{ github.run_number }}
          body: |
            Download **Modular-synth-windows.zip**, unzip it, and double-click `Modular-synth.exe`.
            Built from commit ${{ github.sha }}.
          files: Modular-synth-windows.zip
          make_latest: true

  linux-tests:
    name: Engine tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libxcomposite-dev libgl1-mesa-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build tests
        run: cmake --build build --target EngineTests
      - name: Run tests
        run: ./build/EngineTests_artefacts/Release/EngineTests

  web:
    name: Browser app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install WebAssembly toolchain
        run: sudo apt-get update && sudo apt-get install -y clang-18 lld-18 wasi-libc libc++-18-dev-wasm32 libc++abi-18-dev-wasm32 libclang-rt-18-dev-wasm32
      - name: Build
        run: CXX=clang++-18 ./web/build.sh
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # The same commands through engine.wasm and a native build of the same
      # engine code: the outputs must match.
      - name: Check it sounds the same as the desktop engine
        run: |
          clang++-18 -std=c++17 -O2 -DMS_NO_JUCE=1 -ISource \
            Source/engine/{Params,Automation,ProjectState,Voice,FxChain,Effects,Hr16Bank,EngineCore}.cpp \
            web/wasm/WebEngine.cpp web/tests/native_render.cpp -o native_render
          node web/tests/parity.mjs ./native_render
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/site

  # Every push to main publishes the browser app on GitHub Pages
  # (Settings > Pages > Source must be "GitHub Actions").
  web-publish:
    name: Publish browser app
    needs: web
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
